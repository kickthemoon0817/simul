[package]
version = "0.1.13"
category = "Utility"
title = "Simul Bridge"
description = "Production-oriented Isaac Sim bridge transport for Simul with typed requests and VS Code fallback compatibility."
authors = ["khemoo"]
keywords = ["isaac", "agent", "socket", "bridge"]
writeTarget.kit = true

[[python.module]]
name = "khemoo.simul.extension"

# SECURITY: the bridge runs Python inside Isaac Sim for whoever can reach it.
# Without a token that is every local process (TCP on 127.0.0.1, like the
# stock Python socket on 8226); see docs/isaac-sim.md "Security model".
[settings]
exts."khemoo.simul".host = "127.0.0.1"
exts."khemoo.simul".port = 8229
# Gates only the bridge transport's raw execute_script action. A refused
# script never runs, and the reply says so (UnsafeExecutionDisabled), so simul
# sends it, and every granular tool's script, to the stock Python socket on
# 8226 instead when that socket is enabled. That makes this a bridge guard,
# not a security boundary. The operator control for the agent-authored code
# surface is simul's security.allow_script_execution.
exts."khemoo.simul".allow_unsafe_execution = true
# Require a token on every bridge request (both the framed protocol and the
# raw-code path). Also on, whatever this says, when auth_token below is set or
# when isaacsim.code_editor.python_server (6.0+) has require_auth on; then the
# python_server's token is accepted, so `simul isaac launch
# --generate-auth-token` protects both ports with one token. With auth
# required and no token configured anywhere, every request is rejected.
# Auth only tightens: once required it stays required, with the first token
# seen, until the extension restarts, so a later settings write that clears
# these keys (or replaces /exts/khemoo.simul) does not reopen the bridge.
exts."khemoo.simul".require_auth = false
# The bridge's own token; empty means "use python_server's". Kit takes
# settings on argv, where other local users can read them, so prefer
# --generate-auth-token on 6.0.
exts."khemoo.simul".auth_token = ""
exts."khemoo.simul".max_request_bytes = 1048576
exts."khemoo.simul".max_response_bytes = 10485760
exts."khemoo.simul".max_port_retries = 10
exts."khemoo.simul".discovery_dir = "/tmp/simul"
# Unix socket for the bridge; empty disables. Set it to a path on the
# discovery volume so a containerised bridge is reachable with no ports.
exts."khemoo.simul".socket_path = ""
# Octal permission bits of that socket. connect(2) needs write permission, so
# the owner-only default keeps other local users out. A container bridge
# running as root while the host user connects needs "0666" (the Compose file
# sets it); then the volume directory's mode and the token are the boundary.
exts."khemoo.simul".socket_mode = "0600"
