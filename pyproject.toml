[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simul-mcp"
version = "0.0.35"
description = "MCP server for 3D simulation and DCC tools — USD scene control, Isaac Sim, Blender, and Unreal Engine integration"
authors = [
    {name = "khemoo"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["sim", "simulation", "usd", "mcp", "omniverse", "dcc", "robotics"]

dependencies = [
    "usd-core>=26.3",
    "fastmcp>=3.0,<4",
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
    "typer>=0.15",
    "rich>=14.0",
    "pyyaml>=6.0.2",
    "numpy>=2.0",
    "pillow>=11.0",
    "aiofiles>=24.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "black>=25.0",
    "isort>=6.0",
    "flake8>=7.0",
    "mypy>=1.15",
]
blender = [
    "bpy>=4.2; python_version == '3.11.*'",
    "bpy>=5.1; python_version == '3.13.*'",
]

[project.urls]
Homepage = "https://github.com/khemoo/simul-mcp"
Repository = "https://github.com/khemoo/simul-mcp"
Issues = "https://github.com/khemoo/simul-mcp/issues"

[project.scripts]
simul = "simul_mcp.cli.main:app"
simul-mcp = "simul_mcp.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simul_mcp" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["simul_mcp"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pxr.*",
    "omni.*",
    "carb.*",
    "omniverse.*",
    "bpy",
    "bpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
    "--cov=simul_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "isaac: marks tests that require Isaac Sim environment",
    "unreal_live: marks tests that require a running Unreal Engine editor (Remote Control reachable on the configured host:port)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
