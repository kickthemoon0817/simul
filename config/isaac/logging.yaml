# Logging Configuration for Isaac Sim MCP Server
# This file defines the logging configuration using Python's dictConfig format

version: 1
disable_existing_loggers: false

# Formatters define the format of log messages
formatters:
  simple:
    format: '%(levelname)s - %(name)s - %(message)s'
    
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s() - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
    
  json:
    format: '{"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "file": "%(filename)s", "line": %(lineno)d, "function": "%(funcName)s", "message": "%(message)s"}'
    datefmt: '%Y-%m-%dT%H:%M:%S'
    
  colored:
    (): 'colorlog.ColoredFormatter'
    format: '%(log_color)s%(asctime)s - %(name)s - %(levelname)s%(reset)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
    log_colors:
      DEBUG: cyan
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red,bg_white

# Handlers define where log messages are sent
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: colored
    stream: ext://sys.stdout
    
  console_simple:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
    
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/simul_mcp.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8
    
  file_json:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/simul_mcp.json
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8
    
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/simul_mcp_errors.log
    maxBytes: 5242880  # 5MB
    backupCount: 3
    encoding: utf8
    
  debug_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/simul_mcp_debug.log
    maxBytes: 20971520  # 20MB
    backupCount: 2
    encoding: utf8

# Loggers define the logging hierarchy and configuration
loggers:
  # Root logger configuration
  '':
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
    
  # Isaac Sim MCP specific loggers
  simul_mcp:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.server:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.usd:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.usd.reader:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.mesh:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.adapters:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.adapters.isaac_runtime:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.mcp:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.mcp.server:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.mcp.tools:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  simul_mcp.cli:
    level: INFO
    handlers: [console, file]
    propagate: false
    
  # External library loggers
  fastmcp:
    level: WARNING
    handlers: [console, file]
    propagate: false
    
  asyncio:
    level: WARNING
    handlers: [file]
    propagate: false
    
  urllib3:
    level: WARNING
    handlers: [file]
    propagate: false
    
  # Isaac Sim / Omniverse loggers (when available)
  omni:
    level: WARNING
    handlers: [file]
    propagate: false
    
  carb:
    level: WARNING
    handlers: [file]
    propagate: false
    
  pxr:
    level: WARNING
    handlers: [file]
    propagate: false

# Root logger fallback
root:
  level: INFO
  handlers: [console, file]

# Development profiles
profiles:
  development:
    loggers:
      simul_mcp:
        level: DEBUG
        handlers: [console, file, debug_file]
      simul_mcp.usd:
        level: DEBUG
      simul_mcp.mesh:
        level: DEBUG
      simul_mcp.adapters:
        level: DEBUG
        
  production:
    loggers:
      simul_mcp:
        level: INFO
        handlers: [file, error_file]
      '':
        handlers: [file, error_file]
        
  testing:
    loggers:
      simul_mcp:
        level: DEBUG
        handlers: [console_simple]
      '':
        level: WARNING
        handlers: [console_simple]
        
  json_logging:
    loggers:
      simul_mcp:
        level: INFO
        handlers: [console, file_json]
      '':
        handlers: [console, file_json]
