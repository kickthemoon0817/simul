name: CI

# Security note: this workflow only references trusted inputs
# (matrix-defined Python version, github.ref, github.event_name)
# and never interpolates user-controlled fields (issue title, PR
# body, commit messages, head ref, etc.) into run: blocks. See
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
# for the patterns this workflow deliberately avoids.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel any in-flight push run when the matching PR event fires
# for the same ref — eliminates the duplicate-runs trap when a
# contributor pushes to a feature branch with an open PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: this is a read-only test workflow
# (no deployments, no releases, no comments). Drop GITHUB_TOKEN
# down to read-only contents access.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Install project from uv.lock (with dev extras)
        # uv sync respects uv.lock for reproducibility — the same
        # transitive deps that local dev resolves are what CI runs.
        # Without this, uv pip install would re-resolve from PyPI
        # and a transitive break could flip CI red unrelated to
        # the PR.
        run: uv sync --extra dev

      - name: Run unit tests
        # The project's pyproject.toml addopts already bakes in
        # `-m "not packaging"`, so the bare `pytest tests/`
        # invocation skips the long-running wheel-build tests.
        # Live engine tests (`isaac`, `unreal_live`) are gated by
        # markers and skip automatically when the engine is not
        # reachable.
        run: uv run pytest tests/ --no-cov

  packaging-gate:
    # Pre-publish gate: builds the wheel and inspects its contents
    # to catch regressions in iter14's bridge-ext bundling and
    # iter15's exclude-package-data rule. Only runs on main + PRs
    # to main since it's the slowest job (uv build per test).
    # Note: a packaging-breaking change on a feature branch pushed
    # without opening a PR will not be caught until the PR is
    # created.
    name: Packaging regression tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Install project from uv.lock (with dev extras)
        run: uv sync --extra dev

      - name: Run packaging-marker tests
        # Override the addopts default `-m "not packaging"` by
        # passing `-m packaging` last; pytest takes the LAST -m.
        run: uv run pytest tests/packaging/ -m packaging --no-cov -v

  lint-and-typecheck:
    # Informational lint visibility — does NOT block PRs because the
    # repo carries a documented backlog (~941 mypy errors, isort
    # drift in 5 files, flake8 line-length tension between black's
    # 88 and CLAUDE.md's 119). Each tool runs with
    # `continue-on-error: true` so failures surface in CI logs as a
    # diff-friendly checklist for incremental cleanup, without
    # gating merges on the full backlog. The job itself is also
    # marked `continue-on-error` so the workflow's overall green
    # status remains tied to the actual functional gates
    # (unit-tests + packaging-gate).
    name: Lint + type-check (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Install project from uv.lock (with dev extras)
        run: uv sync --extra dev

      - name: black --check (informational)
        continue-on-error: true
        run: uv run black --check src/ tests/

      - name: isort --check-only (informational)
        continue-on-error: true
        run: uv run isort --check-only src/ tests/

      - name: flake8 (informational)
        # Note: project lacks a flake8 config, so default 79-char
        # max-line-length applies — many failures expected against
        # CLAUDE.md's 119-char convention. A future iter that adds
        # `[flake8] max-line-length = 119` (or migrates to ruff)
        # will tighten this gate.
        continue-on-error: true
        run: uv run flake8 src/ tests/

      - name: mypy (informational)
        # Per pyproject.toml [tool.mypy] this is strictly configured
        # but the codebase has a ~941-error backlog as of iter22.
        # Surfacing the count in CI lets contributors see whether
        # their PR adds or removes errors.
        continue-on-error: true
        run: uv run mypy src/
