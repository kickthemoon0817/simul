# SECURITY: The bridge extension socket accepts TCP connections WITHOUT
# authentication. Isolation here comes from the *publish* address, not the
# bind address:
#
#   - Inside the container the bridge binds 0.0.0.0. Docker forwards a
#     published port to the container's network interface, never to its
#     loopback, so a container-loopback bind is unreachable — the host
#     connects, docker-proxy accepts, and the peer closes with no data. That
#     silent hang looks exactly like Isaac Sim being down.
#   - On the host the ports are published to 127.0.0.1 only, so nothing off
#     this machine can reach them. That is where the loopback restriction
#     belongs.
#
# Set ISAAC_BIND_HOST only if you know why; publishing on 0.0.0.0 (dropping
# the 127.0.0.1: prefix below) is what actually exposes the socket to the
# network. For remote access use an SSH tunnel or an authenticating proxy.
#
# The bridge handles both typed JSON and raw Python (VS Code compat)
# protocols on a single port. The VS Code extension is kept as a
# fallback but is not required for normal operation.

services:
  isaac-sim:
    image: ${ISAAC_SIM_IMAGE:-nvcr.io/nvidia/isaac-sim:5.1.0}
    container_name: ${ISAAC_SIM_CONTAINER_NAME:-simul-isaac51}
    # Runs as root inside the container, which this image requires: /isaac-sim
    # is mode 0750 root:root, so any other uid — including the image's own
    # isaac-sim user (1234) — cannot traverse it and the entrypoint dies with
    # "Permission denied" (exit 126) before Kit ever starts. The --allow-root
    # and OMNI_KIT_ALLOW_ROOT below already assume this; the uid override that
    # used to sit here contradicted them and made the file unstartable.
    #
    # Container root is not host root: it is confined to the container, and the
    # exposure boundary is the 127.0.0.1 publish below, not the uid.
    user: "${ISAAC_SIM_USER:-0:0}"
    gpus: all
    entrypoint:
      - /isaac-sim/isaac-sim.sh
    command:
      - --allow-root
      - --no-window
      - --ext-folder
      - /tmp/extsUser
      - --enable
      - khemoo.simul.mcp
      - --enable
      - isaacsim.code_editor.vscode
      - --/exts/khemoo.simul.mcp/host=${ISAAC_BIND_HOST:-0.0.0.0}
      - --/exts/khemoo.simul.mcp/port=${ISAAC_BRIDGE_PORT:-8229}
      - --/exts/khemoo.simul.mcp/allow_unsafe_execution=true
      - --/exts/khemoo.simul.mcp/max_port_retries=${ISAAC_MAX_PORT_RETRIES:-10}
      - --/exts/khemoo.simul.mcp/discovery_dir=/tmp/simul-mcp
      # Unix socket on the shared discovery volume: the host connects through
      # the bind mount with no published port and no docker-proxy hop. The
      # path is the CONTAINER side of the volume mapping below, so it stays
      # literal — interpolating the host-side SIMUL_DISCOVERY_DIR here would
      # make the bridge bind a directory that does not exist in the container
      # whenever the host dir is overridden, and the socket would silently
      # never appear.
      #
      # The socket is chmod 0666, so any local user on the host can reach it,
      # same as the 127.0.0.1 TCP publishes below: the bridge itself is
      # unauthenticated either way, and the boundary is the mode of the
      # directory the volume points at. The TCP publishes stay for the VS Code
      # fallback; remove them only if that trade is understood.
      - --/exts/khemoo.simul.mcp/socket_path=/tmp/simul-mcp/bridge.sock
      - --/exts/isaacsim.code_editor.vscode/host=${ISAAC_BIND_HOST:-0.0.0.0}
      - --/exts/isaacsim.code_editor.vscode/port=${ISAAC_VSCODE_PORT:-8226}
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      OMNI_KIT_ALLOW_ROOT: "1"
    ports:
      - "127.0.0.1:${ISAAC_BRIDGE_PORT:-8229}:${ISAAC_BRIDGE_PORT:-8229}"
      - "127.0.0.1:${ISAAC_VSCODE_PORT:-8226}:${ISAAC_VSCODE_PORT:-8226}"
    volumes:
      - ./src/simul_mcp/bridge_ext/khemoo.simul.mcp:/tmp/extsUser/khemoo.simul.mcp:ro
      - ${SIMUL_DISCOVERY_DIR:-/tmp/simul-mcp}:/tmp/simul-mcp
