# Logging Configuration for Isaac Sim MCP Server
# This file defines the logging configuration using Python's dictConfig format.
#
# Filenames use ~ which is expanded by setup_logging() before dictConfig.
# Settings.logging.file_path / audit_path / per_instance / retention_days
# override these values at runtime.

version: 1
disable_existing_loggers: false

# Formatters define the format of log messages
formatters:
  simple:
    format: '%(levelname)s - %(name)s - %(message)s'

  detailed:
    format: '%(asctime)s [%(request_id)s %(tool_name)s] %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s() - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  json:
    (): 'simul_mcp.logging.JsonFormatter'

  audit_json:
    (): 'simul_mcp.logging.AuditFormatter'

  colored:
    (): 'colorlog.ColoredFormatter'
    format: '%(log_color)s%(asctime)s [%(request_id)s %(tool_name)s] %(name)s - %(levelname)s%(reset)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
    log_colors:
      DEBUG: cyan
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: red,bg_white

# Handlers define where log messages are sent
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: colored
    stream: ext://sys.stderr

  console_simple:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stderr

  # Daily rotation. backupCount is overridden by Settings.logging.retention_days.
  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: ~/.simul/logs/simul_mcp.log
    when: midnight
    backupCount: 14
    encoding: utf8

  file_json:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: json
    filename: ~/.simul/logs/simul_mcp.json
    when: midnight
    backupCount: 14
    encoding: utf8

  error_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: ~/.simul/logs/simul_mcp_errors.log
    when: midnight
    backupCount: 14
    encoding: utf8

  debug_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: ~/.simul/logs/simul_mcp_debug.log
    when: midnight
    backupCount: 14
    encoding: utf8

  # Audit handler is also injected at runtime by _setup_audit_handler() so the
  # configuration works even if this YAML is replaced. We declare it here too
  # so a YAML-only consumer still gets the audit stream.
  audit_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: audit_json
    filename: ~/.simul/logs/audit.jsonl
    when: midnight
    backupCount: 30
    encoding: utf8

# Loggers define the logging hierarchy and configuration
loggers:
  # Root logger configuration. Default fans into the human-readable file plus
  # the structured JSON file so downstream tooling can pick whichever format.
  '':
    level: INFO
    handlers: [console, file, file_json, error_file]
    propagate: false

  # Isaac Sim MCP specific loggers
  simul_mcp:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.server:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.usd:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.usd.reader:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.mesh:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.adapters:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.adapters.isaac_runtime:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.mcp:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.mcp.server:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.mcp.tools:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  simul_mcp.cli:
    level: INFO
    handlers: [console, file, file_json]
    propagate: false

  # Dedicated audit logger; one JSON line per tool-call boundary.
  simul_mcp.audit:
    level: INFO
    handlers: [audit_file]
    propagate: false

  # External library loggers. error_file ensures Pydantic ValidationError
  # records (raised inside fastmcp.server.server.call_tool) land in
  # simul_mcp_errors.log alongside our own exceptions.
  fastmcp:
    level: WARNING
    handlers: [console, file, error_file]
    propagate: false

  mcp:
    level: WARNING
    handlers: [console, file, error_file]
    propagate: false

  asyncio:
    level: WARNING
    handlers: [file]
    propagate: false

  urllib3:
    level: WARNING
    handlers: [file]
    propagate: false

  # Isaac Sim / Omniverse loggers (when available)
  omni:
    level: WARNING
    handlers: [file]
    propagate: false

  carb:
    level: WARNING
    handlers: [file]
    propagate: false

  pxr:
    level: WARNING
    handlers: [file]
    propagate: false

# Root logger fallback
root:
  level: INFO
  handlers: [console, file, file_json]

# Development profiles
profiles:
  development:
    loggers:
      simul_mcp:
        level: DEBUG
        handlers: [console, file, file_json, debug_file]
      simul_mcp.usd:
        level: DEBUG
      simul_mcp.mesh:
        level: DEBUG
      simul_mcp.adapters:
        level: DEBUG

  production:
    loggers:
      simul_mcp:
        level: INFO
        handlers: [file, file_json, error_file]
      '':
        handlers: [file, file_json, error_file]

  testing:
    loggers:
      simul_mcp:
        level: DEBUG
        handlers: [console_simple]
      '':
        level: WARNING
        handlers: [console_simple]

  json_logging:
    loggers:
      simul_mcp:
        level: INFO
        handlers: [console, file_json]
      '':
        handlers: [console, file_json]
