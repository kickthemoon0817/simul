[package]
version = "0.0.36"
category = "Utility"
title = "Simul MCP Bridge"
description = "Production-oriented Isaac Sim bridge transport for Simul MCP with typed requests and VS Code fallback compatibility."
authors = ["khemoo"]
keywords = ["isaac", "mcp", "socket", "bridge"]
writeTarget.kit = true

[[python.module]]
name = "khemoo.simul.mcp.extension"

[settings]
exts."khemoo.simul.mcp".host = "127.0.0.1"
exts."khemoo.simul.mcp".port = 8229
exts."khemoo.simul.mcp".allow_unsafe_execution = true
exts."khemoo.simul.mcp".max_request_bytes = 1048576
exts."khemoo.simul.mcp".max_response_bytes = 10485760
exts."khemoo.simul.mcp".max_port_retries = 10
exts."khemoo.simul.mcp".discovery_dir = "/tmp/simul-mcp"
